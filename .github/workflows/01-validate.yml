name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Python dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Validate project
        run: python3 scripts/export-book.py
