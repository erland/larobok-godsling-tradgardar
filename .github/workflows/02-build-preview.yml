name: Build Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Python dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"
      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-texgyre lmodern
      - name: Build EPUB and PDF
        run: python3 scripts/build_publish.py --output-dir "${RUNNER_TEMP}/book-dist"
      - name: Upload preview package
        uses: actions/upload-artifact@v7
        with:
          name: godsling-i-nordliga-tradgardar-preview
          path: |
            ${{ runner.temp }}/book-dist/*.epub
            ${{ runner.temp }}/book-dist/*.pdf
          if-no-files-found: error
          retention-days: 7
